[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sacor"
dynamic = ["version"]
description = "Evidence-first document extraction — every extracted value explains itself"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Vincenzo Gallo" }]
keywords = [
    "document-extraction",
    "evidence",
    "confidence-scoring",
    "pdf-parsing",
    "data-extraction",
    "structured-extraction",
    "invoice-extraction",
    "llm",
    "verifiable-ai",
    "italian",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Text Processing",
    "Topic :: Office/Business",
]
dependencies = ["PyYAML~=6.0", "pdfplumber~=0.11", "Pillow~=12.3"]

[project.urls]
Homepage = "https://github.com/vinsblack/sacor"

[project.scripts]
sacor = "sacor.cli:main"

[project.optional-dependencies]
dev = [
    "ruff~=0.16",
    "mypy~=2.3",
    "pytest~=9.1",
    "types-PyYAML",
    "reportlab~=5.0",
    "pypdf~=6.15",
    "types-reportlab",
]
providers = [
    "anthropic~=0.121",
    "openai~=2.53",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sacor"]

[tool.hatch.version]
path = "src/sacor/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "eval", "scripts"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
