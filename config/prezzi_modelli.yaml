# Tabella prezzi dei modelli reali (T4.3). File separato dal codice per
# istruzione esplicita: "I prezzi cambiano: non devono stare nel codice".
# Nessuna garanzia di attualita': prima di un bake-off vero, VERIFICARE i
# prezzi correnti sulla piattaforma di ciascun provider — questa tabella
# scade in fretta.
#
# token_immagine (T4.5, C1): formula usata per stimare i token di
# un'immagine PRIMA di chiamare l'API — le pagine del tier 1 sono
# SCANSIONE/IBRIDA, senza text layer, quindi la stima non puo' venire dalla
# lunghezza del testo. `tipo` e' l'unico campo che il codice legge
# (sacor.providers.token_stima); `formula`/`fonte`/`verificato_il` sono
# documentazione per chi legge il file e vanno tenuti a mano in sincronia
# col `tipo`. Se la formula reale di un provider non e' verificabile in
# questa sessione, si dichiara una stima al rialzo — mai al ribasso.
aggiornato_il: "2026-08-10"

modelli:
  # Anthropic — prezzi API first-party, $/milione di token (skill claude-api).
  claude-opus-5:
    costo_input_per_milione: 5.00
    costo_output_per_milione: 25.00
    token_immagine:
      tipo: lineare_wh_750
      formula: "ceil((larghezza_px * altezza_px) / 750)"
      fonte: "Anthropic, vision guide — formula pubblica per il conteggio token immagine, valida per tutti i modelli Claude attuali"
