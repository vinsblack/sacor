name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src/

      - name: pytest
        run: pytest
