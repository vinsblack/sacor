name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install package
        run: uv pip install --system -e ".[dev]"

      - name: ruff
        run: ruff check .

      - name: mypy
        run: mypy src/

      - name: pytest
        run: pytest

      - name: report accuratezza (corpus sintetico)
        # README dichiara "accuratezza rieseguita in CI a ogni commit" —
        # prima non era vero (CI girava solo test). Corpus reale (PDF, mai
        # nel repo, ADR-042) non puo' girare qui: questo e' il sintetico,
        # gia' committato in corpus/synth/. Non fallisce la build (nessuna
        # soglia dichiarata da far rispettare) — rende visibile il numero
        # ad ogni commit, che e' esattamente il claim da onorare.
        run: python eval/run.py
