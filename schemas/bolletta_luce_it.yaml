schema_version: 1
documento: bolletta_luce_it

campi:
  - nome: pod
    tipo: string
    obbligatorio: true
    estrazione:
      tipo: regex
      pattern: 'IT\d{3}E\d{8}'
  - nome: fornitore
    tipo: string
    obbligatorio: false
    estrazione:
      tipo: regex
      pattern: 'Fornitore:\s*(.+)'
  - nome: periodo_da
    tipo: date
    obbligatorio: true
    estrazione:
      tipo: regex
      pattern: 'Dal\s+(\d{2}[/.]\d{2}[/.]\d{4})'
  - nome: periodo_a
    tipo: date
    obbligatorio: true
    estrazione:
      tipo: regex
      pattern: '\bal\s+(\d{2}[/.]\d{2}[/.]\d{4})'
  - nome: giorni
    tipo: integer
    obbligatorio: false
    descrizione: >-
      Numero di giorni del periodo fatturato. Se non e' scritto esplicitamente
      sul documento ma periodo_da e periodo_a sono entrambi date esatte
      leggibili, calcolalo come la differenza in giorni tra le due date PIU'
      UNO (es. dal 1 al 5 del mese = 5 giorni, non 4) — non lasciarlo null
      solo perche' non c'e' scritto un numero, se e' calcolabile dalle date.
    estrazione:
      tipo: regex
      pattern: '\((\d+)\s*giorni\)'
  - nome: kwh_totale
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Il consumo fatturato nel periodo (somma delle fasce orarie), non il
      consumo annuo su finestra mobile di 12 mesi che alcune bollette
      riportano come numero separato.
    estrazione:
      tipo: regex
      pattern: 'Energia totale:\s*([\d.,]+)\s*kWh'
  - nome: kwh_f1
    tipo: decimal
    obbligatorio: false
    estrazione:
      tipo: regex
      pattern: 'Energia F1:\s*([\d.,]+)\s*kWh'
  - nome: kwh_f2
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Consumo in fascia F2. Se la bolletta usa solo due fasce (es. "F23" o
      "ore vuote" invece di F2/F3 distinte), usa qui il valore aggregato
      F2+F3.
    estrazione:
      tipo: regex
      pattern: 'Energia F2:\s*([\d.,]+)\s*kWh'
  - nome: kwh_f3
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Consumo in fascia F3, distinta da F2. Se la bolletta e' bioraria (solo
      F1 e una fascia aggregata F23/ore-vuote, nessuna terza fascia
      distinta), il valore e' null — non un valore inventato o uno zero non
      dichiarato esplicitamente dal documento.
    estrazione:
      tipo: regex
      pattern: 'Energia F3:\s*([\d.,]+)\s*kWh'
  - nome: importo_totale
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Il totale della sola componente energia (spesso etichettato "Totale
      scontrino" o "Totale bolletta"). MAI un importo finale diverso che
      somma canone RAI, bolli, o rate aggiuntive sopra il totale energia —
      se sulla pagina compaiono piu' totali, scegli quello dello scontrino
      energia, non l'ultimo/il piu' grande.
    estrazione:
      tipo: regex
      pattern: 'Importo totale:\s*EUR\s*([\d.,]+)'

invarianti:
  - id: somma_fasce
    tipo: somma_approssimata
    addendi: [kwh_f1, kwh_f2, kwh_f3]
    totale: kwh_totale
    tolleranza_relativa: 0.005
    severita: warning

  - id: giorni_inclusivi
    tipo: differenza_giorni
    da: periodo_da
    a: periodo_a
    risultato: giorni
    offset: 1
    severita: warning

segmentazione:
  tipo: cambio_valore
  pattern: 'Fattura n\.?\s*([0-9]+)'
  minimo_pagine: 1
