schema_version: 1
documento: bolletta_luce_it

campi:
  - nome: pod
    tipo: string
    obbligatorio: true
    estrazione:
      tipo: regex
      pattern: 'IT\d{3}E\d{8}'
  - nome: fornitore
    tipo: string
    obbligatorio: false
    estrazione:
      tipo: regex
      pattern: 'Fornitore:\s*(.+)'
  - nome: periodo_da
    tipo: date
    obbligatorio: true
    estrazione:
      tipo: regex
      # T4.17 (diagnosi corpus reale, zero costo): 'Dal X' e' il formato
      # sintetico; 'Periodo oggetto di fatturazione: da X a Y' e' quello
      # osservato su bollette reali (NWG Energia).
      pattern: '(?:Dal\s+|Periodo oggetto di fatturazione:\s*da\s+)(\d{2}[/.]\d{2}[/.]\d{4})'
  - nome: periodo_a
    tipo: date
    obbligatorio: true
    estrazione:
      tipo: regex
      pattern: '(?:\bal\s+|Periodo oggetto di fatturazione:\s*da\s+\d{2}[/.]\d{2}[/.]\d{4}\s+a\s+)(\d{2}[/.]\d{2}[/.]\d{4})'
  - nome: giorni
    tipo: integer
    obbligatorio: false
    descrizione: >-
      Numero di giorni del periodo fatturato. Se non e' scritto esplicitamente
      sul documento ma periodo_da e periodo_a sono entrambi date esatte
      leggibili, calcolalo come la differenza in giorni tra le due date PIU'
      UNO (es. dal 1 al 5 del mese = 5 giorni, non 4) — non lasciarlo null
      solo perche' non c'e' scritto un numero, se e' calcolabile dalle date.
    estrazione:
      tipo: regex
      pattern: '\((\d+)\s*giorni\)'
  - nome: kwh_totale
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Il consumo fatturato nel periodo (somma delle fasce orarie), non il
      consumo annuo su finestra mobile di 12 mesi che alcune bollette
      riportano come numero separato.
    estrazione:
      tipo: regex
      # T4.17: reale osservato in due varianti diverse a seconda del
      # fornitore ('Consumo totale fatturato:' / 'Consumo totale del
      # periodo fatturato', senza i due punti in quest'ultimo).
      pattern: '(?:Energia totale|Consumo totale(?: del periodo)? fatturato):?\s*([\d.,]+)\s*kWh'
  - nome: kwh_f1
    tipo: decimal
    obbligatorio: false
    estrazione:
      tipo: regex
      pattern: 'Energia F1:\s*([\d.,]+)\s*kWh'
  - nome: kwh_f2
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Consumo in fascia F2. Se la bolletta usa solo due fasce (es. "F23" o
      "ore vuote" invece di F2/F3 distinte), usa qui il valore aggregato
      F2+F3.
    estrazione:
      tipo: regex
      pattern: 'Energia F2:\s*([\d.,]+)\s*kWh'
  - nome: kwh_f3
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Consumo in fascia F3, distinta da F2. Se la bolletta e' bioraria (solo
      F1 e una fascia aggregata F23/ore-vuote, nessuna terza fascia
      distinta), il valore e' null — non un valore inventato o uno zero non
      dichiarato esplicitamente dal documento.
    estrazione:
      tipo: regex
      pattern: 'Energia F3:\s*([\d.,]+)\s*kWh'
  - nome: importo_totale
    tipo: decimal
    obbligatorio: false
    descrizione: >-
      Il totale FINALE da pagare (spesso etichettato "Totale da pagare"),
      comprensivo di eventuali addebiti extra sommati sopra il totale
      energia (es. canone RAI/abbonamento TV, bolli, rate). Se sulla pagina
      compaiono piu' totali (es. un "Totale bolletta"/"Totale scontrino"
      di sola energia, poi un "Totale da pagare" piu' alto con extra
      aggiunti sopra), scegli SEMPRE quello finale/piu' alto — e' l'importo
      realmente dovuto, non un subtotale intermedio.
    estrazione:
      tipo: regex
      # T4.17: 'Importo totale: EUR X' e' il formato sintetico; sul reale
      # l'etichetta osservata e' sempre una variante di "Totale da pagare"
      # (maiuscole/minuscole/spazi diversi per fornitore), valore in € non EUR.
      pattern: '(?:Importo totale:\s*EUR|(?i:Totale\s+da\s+pagare))\s*[:=]?\s*€?\s*([\d.,]+)'

invarianti:
  - id: somma_fasce
    tipo: somma_approssimata
    addendi: [kwh_f1, kwh_f2, kwh_f3]
    totale: kwh_totale
    tolleranza_relativa: 0.005
    severita: warning

  - id: giorni_inclusivi
    tipo: differenza_giorni
    da: periodo_da
    a: periodo_a
    risultato: giorni
    offset: 1
    severita: warning

segmentazione:
  tipo: cambio_valore
  pattern: 'Fattura n\.?\s*([0-9]+)'
  minimo_pagine: 1
