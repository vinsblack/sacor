<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <rect width="1200" height="300" fill="#0F172A"/>

  <!-- logo, ridotto -->
  <g transform="translate(50,55) scale(0.55)">
    <polygon points="50,12 82.9,31 82.9,69 50,88 17.1,69 17.1,31"
             fill="none" stroke="#2563EB" stroke-width="4" stroke-linejoin="round"/>
    <line x1="50" y1="50" x2="50" y2="28" stroke="#94A3B8" stroke-width="3"/>
    <line x1="50" y1="50" x2="30.95" y2="61" stroke="#94A3B8" stroke-width="3"/>
    <line x1="50" y1="50" x2="69.05" y2="61" stroke="#94A3B8" stroke-width="3"/>
    <circle cx="50" cy="28" r="7" fill="#2563EB"/>
    <circle cx="30.95" cy="61" r="7" fill="#2563EB"/>
    <circle cx="69.05" cy="61" r="7" fill="#2563EB"/>
    <circle cx="50" cy="50" r="8" fill="#06B6D4"/>
  </g>

  <text x="180" y="105" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="64" font-weight="700" fill="#F8FAFC">SACOR</text>
  <text x="60" y="160" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="26" fill="#94A3B8">Evidence-first Document Extraction</text>
  <text x="60" y="200" font-family="Inter, -apple-system, Segoe UI, sans-serif"
        font-size="18" fill="#06B6D4">Every extracted value explains itself.</text>

  <!-- flusso minimale -->
  <text x="60" y="255" font-family="JetBrains Mono, Consolas, monospace"
        font-size="18" fill="#F8FAFC">
    PDF <tspan fill="#94A3B8"> → </tspan>Evidence<tspan fill="#94A3B8"> → </tspan>Confidence<tspan fill="#94A3B8"> → </tspan>Gate<tspan fill="#94A3B8"> → </tspan>JSON
  </text>
</svg>
